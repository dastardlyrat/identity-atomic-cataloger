[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-atomic-cataloger"
version = "0.3.0"
description = "Decompose agent identity, affect, behavior, and agency records into provenance-linked atoms, then compose agent definitions with explicit control and authority boundaries."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.scripts]
identity-atomic = "identity_atomic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
